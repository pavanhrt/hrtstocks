name: CI

# Runs on every pull request and on pushes to the working branches. No cloud credentials are
# used or available here: everything runs against embedded PostgreSQL and mocks.
on:
  pull_request:
  push:
    branches: [develop_gcloud, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Web app (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      # The app tests use embedded PostgreSQL from the repository root tooling.
      - run: npm ci
      - run: npm ci
        working-directory: app
      # The clean-database smoke test seeds through the pipeline package.
      - run: npm ci
        working-directory: services/pipeline
      - run: npm run lint
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.example
      # Clean-database smoke: migrations on an empty PostgreSQL, then the BUILT app serving against it.
      - run: npm run test:smoke

  database-and-pipeline:
    name: Migrations and pipeline (real PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/pipeline/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: services/pipeline
      # db migration tests + ported SQL tests, then the full pipeline suite (including the
      # end-to-end screening run against a migrated, seeded database).
      - run: npm test

  terraform:
    name: Terraform (format and validate, no cloud access)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  images:
    name: Container images build (not pushed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: false
          build-args: |
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci-project
            NEXT_PUBLIC_FIREBASE_API_KEY=ci-key
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci.example
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/pipeline/Dockerfile
          push: false

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
