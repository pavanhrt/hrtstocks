parameter_version: 1.5.0
status: partially_resolved_from_buy_sell_signal_playbooks

documented:
  ema_periods: [5, 13, 26, 50, 100, 200]
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  fibonacci_retracements: [0.236, 0.382, 0.50, 0.618, 0.786]
  papa_extreme_bollinger_deviation: 3.0
  minimum_reward_risk: 3.0
  max_position_risk_fraction: 0.02
  provisional_monthly_loss_stop_fraction: 0.08
  # Resolved in parameter_version 1.1.0 from the BUY/SELL Signal Playbooks'
  # Stage 0 data tables (playbooks/BUY_Signal_Playbook.md and
  # SELL_Signal_Playbook.md, "get the data before you think"), which state
  # these values explicitly rather than leaving them for a backtest. Moved
  # out of project_defaults_requiring_backtest per the null_policy's own
  # allowance for a versioned decision backed by a dedicated source document.
  rsi_period: 14
  stochastic_lookback: 14
  stochastic_smoothing: 3
  bollinger_lookback: 20
  standard_bollinger_deviation: 2.0
  volume_lookback: 20
  volume_multiplier: 1.0
  # The playbooks specify a zigzag swing detector at "~5% monthly/weekly,
  # 2-3% daily" for Dow/Elliott pivot detection. Not a single documented
  # number -- these pick the midpoint of each stated range and are used only
  # by features/structure.js's zigzagPivots(), not by any pre-existing rule.
  zigzag_monthly_pct: 0.05
  zigzag_weekly_pct: 0.05
  zigzag_daily_pct: 0.025
  # Added in parameter_version 1.2.0 for the swing (Weekly->Daily->1H) BUY-1/
  # SELL-3 "Wave 3 Ignition" route checks (swing-strategy-extraction.md §2).
  # Both are disclosed PROJECT_DEFAULT picks from an explicitly-stated range,
  # not single documented numbers -- same status as the zigzag_* percentages
  # above.
  # "1-1.5% hourly" (swing-strategy-extraction.md §7, zig-zag swing detector
  # row) -- midpoint of the stated range.
  zigzag_hourly_pct: 0.0125
  # "Mean volume of the same hour of day over the last 10-20 sessions"
  # (swing-strategy-extraction.md §7, hour-slot volume row) -- midpoint of
  # the stated range.
  hour_slot_volume_lookback_sessions: 15
  # Was mislabeled under project_defaults_requiring_backtest (implying a
  # guessed default) -- docs/swing-strategy-extraction.md's indicator table
  # and playbooks/concepts/papa-price-action-SKILL.md §9 both independently
  # state "14, 14... Wilder confirmed" as an explicit source value, not a
  # backtest-derived guess. Moved here once features/indicators.js's adx()
  # actually depended on the specific value (null_policy's own condition for
  # promoting an entry). This only resolves the smoothing period -- the ADX
  # *threshold* a gate triggers on is the separate pair of parameters below,
  # resolved in parameter_version 1.4.0.
  adx_dmi_period: 14
  # Resolved in parameter_version 1.4.0 (2026-09-11):
  # docs/swing-strategy-extraction.md §13 conflict #4 (ADX no-trend
  # threshold). The general PAPA concept doc and both cross-check documents
  # read "ADX < 20 = no trend," but the swing (Weekly->Daily->1H) BUY/SELL
  # playbooks self-disclose an explicit deviation for their own hourly
  # combination-matrix WAIT check: "the operating threshold in this playbook
  # is 14, not 20... running it at 14 catches trends earlier... so the slope
  # now does the work the level used to" (BUY §11 / SELL §13). Per
  # AGENTS.md's Evidence Priority (a dedicated setup checklist for THIS
  # exact strategy/timeframe outranks a general concept document, and this
  # is the playbook's own reasoned choice, not an oversight), these two
  # values are adopted for the swing hourly combination-matrix WAIT check
  # ONLY (features/hourly-conditions.js's evaluateHourlyAdxCondition) -- they
  # do NOT change the general PAPA/ADX-20 reading anywhere else; no other
  # rule in this codebase consumes a no-trend ADX threshold today. The
  # playbook never states whether 14 also applies to weekly/daily ADX reads,
  # so scope stays hourly-only, matching swing-strategy-extraction.md §13
  # conflict #4's own resolution note.
  swing_hourly_adx_wait_below: 14
  swing_hourly_adx_flat_ceiling: 25
  # Resolved in parameter_version 1.5.0 (Correction Cycle 2, 2026-09-11):
  # every source document that states the swing playbooks' M8/S8 reward:risk
  # gate (smm-decision-sheet-SKILL.md §7; BUY.../SELL... §7/§9;
  # buy-conditions.md/sell-conditions.md "Risk gate") uses a strict `> 3`, not
  # the existing `minimum_reward_risk: 3.0` above's `>=` (that parameter is
  # used by the positional BSP-/SSP- strategies, which this does not change --
  # see architecture-plan.md §7 decision 1 and swing-strategy-extraction.md
  # §13 conflict #1). A new, strategy-specific key so the two thresholds
  # cannot be confused or accidentally merged.
  swing_minimum_reward_risk_strict: 3.0
  # Resolved in parameter_version 1.5.0 (Correction Cycle 2): swing-strategy-
  # extraction.md §13 conflict #9 -- BUY.../SELL... §4.5/§6.4's own addition
  # to the ending-diagonal setup (BUY-3/SELL-2), "in practice at least fifteen
  # to twenty hourly candles" of structure before the wedge can be trusted.
  # Picks the FLOOR of the stated range, not the midpoint -- for a minimum
  # structural requirement, the lower bound is the conservative (stricter)
  # choice: requiring fewer candles makes the gate easier to trigger falsely,
  # so anchoring low keeps this project's characteristic error on the side of
  # under-triggering rather than over-triggering a signal.
  ending_diagonal_min_hourly_candles: 15
  # Resolved in parameter_version 1.5.0 (Correction Cycle 2): swing-strategy-
  # extraction.md §12.4's PAPA "Rounding bottom/top" formation requires
  # "multiple big RED/GREEN candles" and a "strong breakout candle" -- both
  # qualifiers are stated with no number anywhere in any source document.
  # Rather than inventing an absolute threshold, this expresses "big"/"strong"
  # the same way features/patterns.js's own disclosed defaults already do
  # (TREND_LOOKBACK_BARS-style trailing-average comparison): a candle's body
  # must be at least this multiple of the average body size over the same
  # trailing window used elsewhere in that module, to count as "big" (for the
  # base) or "strong" (for the breakout). 1.5x is a disclosed PROJECT_DEFAULT
  # picked for symmetry with HAMMER_UPPER_WICK_CAP_FRACTION's own
  # this-project-picks-a-plausible-multiple precedent -- not extracted from
  # any source number, since none exists; a future reviewer can change this
  # single value without touching detection logic.
  rounding_pattern_body_size_multiplier: 1.5

project_defaults_requiring_backtest:
  atr_period: null
  pivot_left_window: null
  pivot_right_window: null
  support_resistance_tolerance: null
  breakout_buffer: null
  followup_window: null
  gap_significance_threshold: null
  divergence_lookback: null
  pivot_matching_tolerance: null
  minimum_liquidity_thresholds: null

null_policy: unresolved_parameters_must_not_be_assumed_documented
