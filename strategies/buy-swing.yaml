strategy:
  id: buy-swing-playbook
  name: The Buy Signal Playbook (Swing -- Weekly to Daily to 1-Hour)
  framework: WBP
  rule_version: 1.0.0
  parameter_version: 1.1.0
  status: partially_automated
  scope: [equity, index]

provenance:
  source_register: ../docs/swing-strategy-extraction.md
  source_document: playbooks/BUY_Signal_Playbook_Weekly_Daily_1H.md
  source_group: WBP
  locator_granularity: gate_level
  production_rule_trace_ready: false
  requirement: >
    This is a DIFFERENT document from strategies/buy-signal-playbook.yaml (BSP-,
    Monthly->Weekly->Daily positional) -- see docs/swing-strategy-extraction.md
    §1 source register, conflict #2. Gate IDs are namespaced WBP-M1..M8 so
    nothing collides with BSP-M1..M8, per architecture-plan.md §7 decision 2.

    Both playbooks state the direction lock explicitly: "M1 AND M2 AND M3 AND
    M4 must all pass before the hourly chart is opened" -- gates WBP-M5..M8
    (the hourly Elliott setup, PAPA trigger, SMM Bull Hat, and reward/risk)
    require 1-hour OHLCV bars, which this pipeline does not ingest yet
    (architecture-plan.md Phase 2 REMAINING item), so they stay MANUAL_REVIEW
    sentinels below -- not automated, not scored as PASS, and never silently
    skipped. WBP-M1..M4 (the weekly+daily direction lock) are real, automated,
    DOCUMENTED gates as of rule_version 1.0.0 -- the first time this codebase
    computes a daily Dow state and an Elliott wave position for the rule
    engine (previously only weekly/monthly Dow state was computed in
    features/context.js, and no Elliott position was computed there at all).

rules:
  - id: WBP-M1
    playbook_gate: M1
    name: Weekly Dow direction
    source_status: DOCUMENTED
    timeframe: weekly
    direction: bullish
    inputs: [weekly_dow_state]
    expression: "weekly_dow_state == 'uptrend_intact' or weekly_dow_state == 'confirmed_reversal_bullish'"
    true_result: PASS
    false_result: FAIL
    missing_result: NO_DATA
    hard_gate: false
    note: >
      hard_gate is false for the same cross-strategy pooling reason as
      BSP-M1 (see that file's note) -- evaluateRules()/classify() pool
      hard-gate failures across every active strategy with no direction
      scoping. A future /analysis page (Phase 5) must read WBP-*/WSP-*
      traces directly and apply the AND of M1-M4 itself, exactly like the
      existing buy-signals/sell-signals pages already do for BSP-/SSP-.
      Locator: swing-strategy-extraction.md §4 table, M1 row ("Uptrend
      (HH+HL) intact, or confirmed reversal"). The fuller M1 table this row
      summarizes (source §2) was not further transcribed into the
      extraction doc beyond this row -- if it adds a sideways+breakout
      branch (as BSP-M1's own, different-document M1 table does), that is
      not encoded here; only the two states this row names are.

  - id: WBP-M2
    playbook_gate: M2
    name: Weekly Elliott position
    source_status: DOCUMENTED
    timeframe: weekly
    direction: bullish
    inputs: [weekly_elliott_structure_type, weekly_elliott_direction, weekly_elliott_current_wave, weekly_elliott_wave_state]
    expression: "(weekly_elliott_structure_type == 'impulse' and weekly_elliott_direction == 'bullish' and weekly_elliott_current_wave in ['1', '3', '5']) or (weekly_elliott_structure_type == 'zigzag' and weekly_elliott_direction == 'bearish' and weekly_elliott_wave_state == 'completed')"
    true_result: PASS
    false_result: FAIL
    missing_result: NO_DATA
    hard_gate: false
    note: >
      hard_gate is false for the same cross-strategy pooling reason as
      WBP-M1. Locator: swing-strategy-extraction.md §4 table, M2 row
      ("Inside motive (1)/(3)/(5), or a completed (A)-(B)-(C) down; all 3
      Elliott rules PASS"). "all 3 Elliott rules PASS" is satisfied by
      construction -- features/wave.js's labelWave() only ever reports
      structure_type='impulse' when GUE-IMPULSE-001/002/003 already
      validated at that window length (see wave.js's validateImpulsePrefix),
      so no separate rule-arithmetic check is needed here. Unlike
      BSP-M4A (the positional document's equivalent, still a MANUAL_REVIEW
      sentinel), this is now a real automated gate: features/context.js
      computes weekly_elliott_* from the same labelPivotSequence + labelWave
      the Direction feature uses, not a separate approximation.

  - id: WBP-M3
    playbook_gate: M3
    name: Daily Dow direction
    source_status: DOCUMENTED
    timeframe: daily
    direction: bullish
    inputs: [daily_dow_state, daily_no_live_triggered_bearish_pattern]
    expression: "(daily_dow_state == 'uptrend_intact' or daily_dow_state == 'confirmed_reversal_bullish') and daily_no_live_triggered_bearish_pattern"
    true_result: PASS
    false_result: FAIL
    missing_result: NO_DATA
    hard_gate: false
    note: >
      hard_gate is false for the same cross-strategy pooling reason as
      WBP-M1. Locator: swing-strategy-extraction.md §4 table, M3 row
      ("Uptrend intact, pullback holding last HL, or confirmed reversal; no
      live triggered bearish daily pattern"). "Pullback holding last HL" is
      not a separate branch -- classifyDowStructure() already reports
      'uptrend_intact' only while the last close stays above the last swing
      low, which IS "holding the last HL"; a break below it is the same
      event the source calls trend invalidation. "No live triggered bearish
      daily pattern" reuses features/patterns.js's TRIGGERED/bearish
      detections directly (features/alignment.js's own opposing-pattern
      logic, reused here for a different purpose: gating entry, not scoring
      Direction confluence).

  - id: WBP-M4
    playbook_gate: M4
    name: Daily wave + Tide
    source_status: DOCUMENTED
    timeframe: daily
    direction: bullish
    inputs: [daily_elliott_structure_type, daily_elliott_direction, daily_elliott_current_wave, daily_macd_histogram_change, daily_macd_histogram_prior_phase]
    expression: "(daily_elliott_structure_type == 'impulse' and daily_elliott_direction == 'bullish' and daily_elliott_current_wave in ['1', '3', '5']) and (daily_macd_histogram_change == 'uptick' or (daily_macd_histogram_change == 'flat' and daily_macd_histogram_prior_phase == 'down'))"
    true_result: PASS
    false_result: FAIL
    missing_result: NO_DATA
    hard_gate: false
    note: >
      hard_gate is false for the same cross-strategy pooling reason as
      WBP-M1. Locator: swing-strategy-extraction.md §4 table, M4 row
      ("Inside motive 1/3/5 AND daily MACD uptick/flat-after-down, visual
      read agreeing"). Implemented as a single AND gate matching this
      table's own single-row presentation (unlike BSP-M4A/M4B, which split
      an equivalent concept into two rows for a different document's own
      table structure).

  - id: WBP-M5
    playbook_gate: M5
    name: Hourly Elliott setup (BUY-1..BUY-5)
    source_status: DOCUMENTED
    timeframe: 1h
    direction: bullish
    inputs: [hourly_elliott_setup]
    expression: manual_review
    true_result: MANUAL_REVIEW
    false_result: MANUAL_REVIEW
    missing_result: MANUAL_REVIEW
    hard_gate: false
    note: >
      No longer blocked on 1-hour bar ingestion itself -- that now exists
      (run-screening/index.js's ingestHourlyBarsAndDetectRoutes, gated on
      WBP-M1..M4 all passing). Two of the five BUY routes are detected by
      features/hourly-routes.js: BUY-1 "Wave 3 Ignition" (detectWave3Ignition,
      the most completely documented route -- swing-strategy-extraction.md
      §2) and BUY-4 "Wave 2 Pullback" (detectWave2Pullback, reusing the
      candlestick-pattern detectors from features/patterns.js for its
      required PAPA-trigger check). Correction Cycle 2 (2026-09-11) resolved
      this gate into a real, evidence-driven pass/fail for the FIRST time:
      features/swing-analysis.js's evaluateSwingHypothesis now treats M5 as
      passed when the selected route's own requiredChecksPassed is true, and
      flows that into a real finalAction (BUY/SELL, no longer permanently
      WAIT) alongside M6-M8 below. The pooled rule_traces row for this gate
      ID itself STILL reads MANUAL_REVIEW (the cross-strategy pooling reason
      every other note in this file explains -- M5-M8 never fit the shared
      YAML/rule-engine path M1-M4 use), but the real evidence now lives in
      swing_analysis_results.selected_route/route_evidence and genuinely
      gates finalAction from there. This gate still stays incomplete route
      coverage, not a missing specification: "one of BUY-1..BUY-5 identified"
      means ruling in/out all five, and BUY-2, BUY-3, BUY-5 are NOT
      implemented (each for its own disclosed, different reason -- see
      hourly-routes.js's own header comment) -- a non-match from the
      implemented detectors does not mean M5 fails, since a different route
      might apply.

  - id: WBP-M6
    playbook_gate: M6
    name: Price-action trigger (hourly PAPA setup)
    source_status: DOCUMENTED
    timeframe: 1h
    direction: bullish
    inputs: [hourly_papa_buy_setup_triggered]
    expression: manual_review
    true_result: MANUAL_REVIEW
    false_result: MANUAL_REVIEW
    missing_result: MANUAL_REVIEW
    hard_gate: false
    note: >
      Same pooling-vs-real-evidence split as WBP-M5's note: the pooled trace
      for this gate ID still reads MANUAL_REVIEW, but Correction Cycle 2
      (2026-09-11) added real evidence -- features/papa-formations.js
      detects the DOCUMENTED-mechanism subset of the 10 BUY PAPA formations
      (Bull Counter Attack, Genuine/Fake Breakout, Gap Up, Mother Candle --
      see that file's own header for the full scope note and what's still
      not implemented: Sandwich, Rounding Bottom, Accumulation, Tweezers),
      and evaluateSwingHypothesis now genuinely gates finalAction on at
      least one same-direction formation having TRIGGERED (not merely
      OBSERVED) this run.

  - id: WBP-M7
    playbook_gate: M7
    name: SMM Bull Hat (Step 1 AND Step 2)
    source_status: DOCUMENTED
    timeframe: 1h
    direction: bullish
    inputs: [hourly_bull_hat_step1, hourly_bull_hat_step2]
    expression: manual_review
    true_result: MANUAL_REVIEW
    false_result: MANUAL_REVIEW
    missing_result: MANUAL_REVIEW
    hard_gate: false
    note: >
      RESOLVED (Correction Cycle 2, 2026-09-11): swing-strategy-extraction.md
      §13 conflict #11 (the Step 2 crossover choice) is resolved by reusing,
      unchanged, the exact disclosed choice this codebase already made for
      BSP-M7B/SSP-S7B (positional, daily) -- a Stochastic %K/%D crossover
      from <20/>80, OR an RSI uptick/downtick through 40/60 -- re-applied to
      the 1-hour chart (features/smm-hat.js#evaluateSmmHat). Step 1 (the
      Tide) reuses the same daily MACD histogram phase and Dow state
      WBP-M4 already reads. Same pooling-vs-real-evidence split as WBP-M5/M6:
      the pooled trace for this gate ID still reads MANUAL_REVIEW, but real
      Hat evidence now gates finalAction directly.

  - id: WBP-M8
    playbook_gate: M8
    name: Reward-to-risk gate (strict > 3)
    source_status: DOCUMENTED
    timeframe: 1h
    direction: bullish
    inputs: [entry, structural_stop, target]
    expression: manual_review
    true_result: MANUAL_REVIEW
    false_result: MANUAL_REVIEW
    missing_result: MANUAL_REVIEW
    hard_gate: false
    note: >
      RESOLVED (Correction Cycle 2, 2026-09-11): features/reward-risk.js#computeRewardRisk
      wires the strict `> 3.0` threshold (config/parameters.yaml
      `swing_minimum_reward_risk_strict`, added this cycle) against whichever
      M5 route's own entry/stop/target evidence exists. Returns null (never a
      guessed number) when the selected route has no computable target --
      true today for BUY-4/SELL-4, whose documented target ("the BUY-1
      wave-3 objectives") isn't computed by that route's own detector. Same
      pooling-vs-real-evidence split as WBP-M5..M7: the pooled trace for
      this gate ID still reads MANUAL_REVIEW, but real reward:risk evidence
      now gates finalAction directly.
